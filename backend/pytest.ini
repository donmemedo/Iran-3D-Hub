# Run from backend/:  python -m pytest -q   (tests run in-process, no server needed)
# filterwarnings: silence deprecation noise raised from third-party packages only; a
# deprecation raised from our own code (module "app.*" or "tests.*") still shows up.
[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore::DeprecationWarning:(starlette|fastapi|httpx|pydantic|pydantic_settings|sqlalchemy|sqlmodel|multipart|python_multipart|jwt|uvicorn|anyio)(\..*)?
    ignore::PendingDeprecationWarning:(starlette|fastapi|multipart|python_multipart)(\..*)?
